<title>Riverside Sandbox</title>
<style>
  :root { --bg:#141821; --panel:#1e2531; --ink:#e8e4da; --muted:#8b93a7; --accent:#74c46b; }
  * { box-sizing: border-box; }
  /* 100% rather than 100vh: when this page is embedded in a host that already
     pads for the phone's safe area, 100vh would overflow it by exactly that. */
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding-block: 20px; padding-inline: 20px;
    font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .stage {
    position: relative; width: min(94vw, 960px); aspect-ratio: 4 / 3;
    background: #000; border: 2px solid #2c3242; border-radius: 4px;
    overflow: hidden; box-shadow: 0 10px 40px #0008;
  }
  #game, #game canvas { width: 100%; height: 100%; display: block; }

  /* The talk panel: the same planks as the bag, sliding up from the bottom. */
  #dialogue {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px;
    background:
      repeating-linear-gradient(180deg, #7a5a38 0 26px, #6a4c2e 26px 28px, #8a683f 28px 30px, #7a5a38 30px 34px);
    border-top: 4px solid #3d2a17; box-shadow: 0 -6px 18px #0007;
    transform: translateY(104%); transition: transform .2s ease-out;
  }
  #dialogue.show { transform: none; }
  @media (prefers-reduced-motion: reduce) { #dialogue { transition: none; } }
  #speaker { align-self: flex-start; font-size: 12px; letter-spacing: .08em;
             color: #f1e4c8; background: #3d2a17; padding: 2px 8px; border-radius: 2px; }
  #speaker:empty { display: none; }
  #line { font-size: 15px; line-height: 1.45; color: #f7efdc; text-shadow: 0 1px 0 #3d2a1780; }
  #more { color: #d9c7a3; font-size: 12px; text-align: right; }
  #choices { display: flex; flex-direction: column; gap: 2px; }
  #choices:empty { display: none; }
  #choices button {
    display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left;
    font: inherit; color: #e6d5b2; background: #5e4229; border: 2px solid #4d3520;
    border-radius: 3px; padding: 5px 9px; cursor: pointer;
  }
  #choices button .n { color: #a58b63; font-size: 11px; }
  #choices button.on { background: #4f5a2c; color: #f7efdc; border-color: var(--accent); }
  #choices button.on .n { color: #cfe3ad; }

  #focus {
    position: absolute; inset: 0; display: none; place-items: center;
    background: #0b0e14b0; cursor: pointer;
  }
  #focus.show { display: grid; }
  #focus span { border: 1px solid #ffffff40; border-radius: 4px; padding: 9px 14px; background: #1e2531cc; }

  .bar { width: min(94vw, 960px); display: flex; flex-wrap: wrap; gap: 8px 20px;
         align-items: center; justify-content: space-between; color: var(--muted); }
  kbd { background: var(--panel); border: 1px solid #39405240; border-bottom-width: 2px;
        border-radius: 3px; padding: 1px 6px; color: var(--ink); }
  #hud { color: var(--accent); }
  #prompt { color: var(--ink); }

  /* The bag: a wooden panel that slides in from the left of the stage. Planks
     are a repeating gradient in the palette's wood tones; slots are cells of a
     dark grid, so the thin lines between them are the grid showing through. */
  #bag {
    position: absolute; left: 0; top: 0; bottom: 0; width: min(46%, 340px);
    display: flex; flex-direction: column; gap: 3%; padding: 4% 3.5%;
    background:
      repeating-linear-gradient(180deg, #7a5a38 0 26px, #6a4c2e 26px 28px, #8a683f 28px 30px, #7a5a38 30px 34px);
    border-right: 4px solid #3d2a17; box-shadow: 6px 0 18px #0007;
    transform: translateX(-104%); transition: transform .22s ease-out;
  }
  #bag.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { #bag { transition: none; } }
  #bag .title { color: #f1e4c8; font-weight: 600; letter-spacing: .06em; text-shadow: 0 1px 0 #3d2a17; }
  #bag .hint { color: #d9c7a3; font-size: 11px; }
  #slots {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
    background: #3d2a17; border: 2px solid #3d2a17; border-radius: 3px;
  }
  #slots .cell {
    aspect-ratio: 1; display: grid; place-items: center; background: #5e4229;
    box-shadow: inset 0 2px 0 #6d4f31, inset 0 -2px 0 #4d3520;
  }
  #slots .cell.cur { outline: 2px solid var(--accent); outline-offset: -2px; }
  #slots .cell.on { background: #4f5a2c; }
  .icon { width: 48px; height: 48px; max-width: 80%; max-height: 80%;
          image-rendering: pixelated; background-repeat: no-repeat; }
  #bag .name { color: #f1e4c8; min-height: 1.5em; }
  #wname { color: var(--accent); }

  /* The character sheet: the same planks as the bag, dropping from the top.
     Each panel comes from the edge it belongs to - bag from the pack at your
     side, talk from the person in front of you, this from you. */
  #sheet {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px;
    background:
      repeating-linear-gradient(180deg, #7a5a38 0 26px, #6a4c2e 26px 28px, #8a683f 28px 30px, #7a5a38 30px 34px);
    border-bottom: 4px solid #3d2a17; box-shadow: 0 6px 18px #0007;
    transform: translateY(-104%); transition: transform .22s ease-out;
  }
  #sheet.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { #sheet { transition: none; } }
  #sheet .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #sheet .name { color: #f7efdc; font-size: 17px; letter-spacing: .02em;
                 text-shadow: 0 1px 0 #3d2a17; }
  #sheet .lvl { color: #f1e4c8; font-size: 12px; letter-spacing: .08em;
                background: #3d2a17; padding: 2px 8px; border-radius: 2px; }
  #sheet .cols { display: grid; grid-template-columns: minmax(0, 360px) auto;
                 gap: 16px 28px; align-items: start; justify-content: space-between; }
  @media (max-width: 560px) { #sheet .cols { grid-template-columns: 1fr; } }

  .stats { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .stat { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; }
  .stat .k { color: #d9c7a3; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; }
  .stat .v { color: #f7efdc; font-variant-numeric: tabular-nums; }
  .stat .meter { width: 100%; height: 10px; background: #3d2a17; border-radius: 2px;
                 overflow: hidden; box-shadow: inset 0 1px 0 #00000055; }
  .stat .meter i { display: block; height: 100%; }
  .stat .meter i.hp { background: linear-gradient(#b4483f, #8d3129); }
  .stat .meter i.xp { background: linear-gradient(#8fb14a, #5f7f30); }
  .stat.plain .v { grid-column: 2 / 4; justify-self: start; }

  .gear { display: flex; gap: 10px; }
  .gear .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 80px; }
  .gear .label { color: #d9c7a3; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .gear .cell {
    width: 100%; aspect-ratio: 1; display: grid; place-items: center;
    background: #5e4229; border: 2px solid #3d2a17; border-radius: 3px;
    box-shadow: inset 0 2px 0 #6d4f31, inset 0 -2px 0 #4d3520;
  }
  .gear .cell.cur { outline: 2px solid var(--accent); outline-offset: -4px; }
  .gear .cell.empty { color: #8a6b48; font-size: 20px; }
  .gear .worn { color: #f1e4c8; font-size: 11px; text-align: center; min-height: 2.6em; }
  .gear .worn em { display: block; color: #a58b63; font-style: normal; font-size: 10px; }
  #sheet .hint { color: #d9c7a3; font-size: 11px; }

  /* The journal: the same planks again, from the right - the bag is at your
     side, the sheet is you, the talk panel is whoever is in front of you, and
     this is the notebook in your other hand. */
  #journal {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(58%, 420px);
    display: flex; flex-direction: column; gap: 8px; padding: 14px 16px;
    background:
      repeating-linear-gradient(180deg, #7a5a38 0 26px, #6a4c2e 26px 28px, #8a683f 28px 30px, #7a5a38 30px 34px);
    border-left: 4px solid #3d2a17; box-shadow: -6px 0 18px #0007;
    transform: translateX(104%); transition: transform .22s ease-out;
  }
  #journal.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { #journal { transition: none; } }
  #journal .title { color: #f1e4c8; font-weight: 600; letter-spacing: .06em;
                    text-shadow: 0 1px 0 #3d2a17; }
  #journal .hint { color: #d9c7a3; font-size: 11px; }
  #qlist { display: flex; flex-direction: column; gap: 7px; overflow: auto; flex: 1; }
  #qlist .none { color: #d9c7a3; font-size: 12px; }
  .quest { display: flex; flex-direction: column; gap: 3px; padding: 7px 9px;
           background: #5e4229; border: 2px solid #4d3520; border-left-width: 4px;
           border-radius: 3px; }
  .quest.ready { border-left-color: var(--accent); }
  .quest.active { border-left-color: #d9c7a3; }
  .quest.done { border-left-color: #4d3520; opacity: .55; }
  .quest b { color: #f7efdc; font-size: 13px; font-weight: 600; }
  .quest .who { color: #d9c7a3; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .quest .sum { color: #e6d5b2; font-size: 11px; line-height: 1.4; }
  .quest ul { margin: 2px 0 0; padding: 0; list-style: none;
              display: flex; flex-direction: column; gap: 1px; }
  .quest li { display: flex; gap: 6px; align-items: baseline; color: #e6d5b2; font-size: 12px; }
  .quest li i { font-style: normal; color: #a58b63; width: 1em; flex: none; }
  .quest li.met { color: #cfe3ad; }
  .quest li.met i { color: var(--accent); }
  .quest li .n { margin-left: auto; color: #a58b63; font-variant-numeric: tabular-nums; }
  .quest .pay { color: #d9c7a3; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }

  /* What just happened, said once and gone: taking an errand, ticking one off,
     finishing it. The log is where you go to look it up; this is so you do not
     have to while you are in the middle of something. */
  /* Under the panels, not over them: a toast that lands half on top of the
     journal it is announcing reads as two things fighting. */
  #dialogue, #bag, #sheet, #journal { z-index: 2; }
  #focus { z-index: 3; }
  #toasts { position: absolute; left: 0; right: 0; top: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            pointer-events: none; z-index: 1; }
  .toast { background: #1e2531e6; border: 1px solid #74c46b60; border-left: 3px solid var(--accent);
           border-radius: 3px; padding: 5px 11px; max-width: 80%;
           animation: toast 2.8s ease-out forwards; }
  .toast b { display: block; color: var(--accent); font-size: 10px;
             letter-spacing: .1em; text-transform: uppercase; }
  .toast span { color: var(--ink); font-size: 12px; }
  @keyframes toast {
    0% { opacity: 0; transform: translateY(-6px); }
    10%, 78% { opacity: 1; transform: none; }
    100% { opacity: 0; transform: translateY(-4px); }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation-duration: 2.8s; } }

  /* touch controls: a d-pad and the three actions, only on coarse pointers */
  .touch { display: none; gap: 16px; align-items: center; }
  @media (pointer: coarse) { .touch { display: flex; } }
  .dpad { display: grid; grid-template-columns: repeat(3, 44px); gap: 5px; }
  .acts { display: grid; grid-template-columns: repeat(2, 52px); gap: 5px; }
  .touch button { height: 44px; font-size: 15px; color: var(--ink); background: var(--panel);
                  border: 1px solid #39405260; border-radius: 4px; touch-action: none; }
  .touch button.on { background: var(--accent); color: #10141c; }
  .dpad .sp { visibility: hidden; }
  .acts .slash { font-size: 19px; }
</style>



<h1>Riverside <span>&middot; 30&times;30 tiles &middot; 2x art &middot; map, props, NPCs all from content/</span></h1>

<div class="stage">
  <div id="game"></div>
  <div id="dialogue">
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="choices"></div>
    <div id="more"></div>
  </div>
  <div id="bag" aria-hidden="true">
    <div class="title">BAG</div>
    <div id="slots"></div>
    <div class="name" id="bagname"></div>
    <div class="hint">arrows move &middot; E equip / remove &middot; I close</div>
  </div>
  <div id="sheet" aria-hidden="true">
    <div class="who">
      <span class="name" id="cname"></span>
      <span class="lvl" id="clvl"></span>
    </div>
    <div class="cols">
      <div class="stats" id="cstats"></div>
      <div class="gear" id="cgear"></div>
    </div>
    <div class="hint">&larr; &rarr; choose &middot; E take off &middot; C close</div>
  </div>
  <div id="journal" aria-hidden="true">
    <div class="title">JOURNAL</div>
    <div id="qlist"></div>
    <div class="hint">J close</div>
  </div>
  <div id="toasts"></div>
  <div id="focus"><span>Click to play</span></div>
</div>

<div class="bar">
  <div>
    <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move
    &nbsp; <kbd>E</kbd> talk / take &nbsp; <kbd>Space</kbd> slash &nbsp; <kbd>I</kbd> bag &nbsp; <kbd>C</kbd> sheet
    &nbsp; <kbd>J</kbd> journal &nbsp; <kbd>Q</kbd> swap
    &nbsp; <span id="prompt"></span>
  </div>
  <div><span id="qlog"></span> &nbsp; <span id="wname">&#9876; no weapon</span> &nbsp; <span id="hud">idle-down</span></div>
</div>

<div class="touch">
  <div class="dpad">
    <button class="sp" tabindex="-1"></button>
    <button data-dir="up" aria-label="Move up">&uarr;</button>
    <button class="sp" tabindex="-1"></button>
    <button data-dir="left" aria-label="Move left">&larr;</button>
    <button data-dir="down" aria-label="Move down">&darr;</button>
    <button data-dir="right" aria-label="Move right">&rarr;</button>
  </div>
  <div class="acts">
    <button data-act="talk" aria-label="Talk or take">E</button>
    <button data-act="slash" class="slash" aria-label="Slash">&#9876;</button>
    <button data-act="swap" aria-label="Swap weapon">Q</button>
    <button data-act="bag" aria-label="Open the bag">I</button>
    <button data-act="sheet" aria-label="Open the character sheet">C</button>
    <button data-act="journal" aria-label="Open the journal">J</button>
  </div>
</div>

<script>
  const $ = (s) => document.getElementById(s);

  window.__hud = ({ anim, tile, prompt, verb, bagFull, talking, quests }) => {
    $('hud').textContent = `${anim}  tile ${tile[0]},${tile[1]}`;
    let p = '';
    if (!talking && prompt) {
      p = verb === 'take' && bagFull ? `bag full - ${prompt} stays` : `press E: ${verb} ${prompt}`;
    }
    $('prompt').textContent = p;
    $('qlog').textContent = quests ? `✦ ${quests} quest${quests === 1 ? '' : 's'}` : '';
  };

  // The journal. Read-only: a quest is taken and handed in by talking to
  // someone, so there is nothing here to press - only what is outstanding,
  // how far along it is, and what it pays.
  const OBJ_MARK = { collect: '⬦', kill: '⚔', talk: '☰', visit: '⚑' };

  window.__quests = ({ open, quests }) => {
    const list = $('qlist');
    list.replaceChildren();
    if (!quests.length) {
      const el = document.createElement('div');
      el.className = 'none';
      el.textContent = 'Nothing yet. Ask someone whether there is work going.';
      list.append(el);
    }
    for (const q of quests) {
      const card = document.createElement('div');
      card.className = `quest ${q.state}`;
      const name = document.createElement('b');
      name.textContent = q.name;
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = [q.giver, { ready: 'ready to hand in', done: 'done',
                                    active: 'in hand' }[q.state]]
        .filter(Boolean).join(' · ');
      const sum = document.createElement('div');
      sum.className = 'sum';
      sum.textContent = q.summary;
      const ul = document.createElement('ul');
      for (const o of q.objectives) {
        const li = document.createElement('li');
        li.className = o.met ? 'met' : '';
        const mark = document.createElement('i');
        mark.textContent = o.met ? '✔' : (OBJ_MARK[o.kind] || '◦');
        li.append(mark, document.createTextNode(o.text));
        if (o.need > 1) {
          const n = document.createElement('span');
          n.className = 'n';
          n.textContent = `${o.have}/${o.need}`;
          li.append(n);
        }
        ul.append(li);
      }
      card.append(name, who, sum, ul);
      if (q.reward) {
        const pay = document.createElement('span');
        pay.className = 'pay';
        pay.textContent = `pays ${q.reward}`;
        card.append(pay);
      }
      list.append(card);
    }
    const panel = $('journal');
    panel.classList.toggle('open', open);
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
  };

  window.__toast = ({ title, text }) => {
    const el = document.createElement('div');
    el.className = 'toast';
    const b = document.createElement('b');
    b.textContent = title;
    const s = document.createElement('span');
    s.textContent = text;
    el.append(b, s);
    $('toasts').append(el);
    el.addEventListener('animationend', () => el.remove());
    while ($('toasts').childElementCount > 4) $('toasts').firstElementChild.remove();
  };

  // The bag. Icons are the world's own item cells, read straight out of the
  // items atlas at 3x, so a thing looks the same on the ground and in hand.
  const itemIcon = (index) => {
    const A = window.ART.manifest.atlases.items;
    const [fw, fh] = A.frame;
    const Z = 3;
    const el = document.createElement('span');
    el.className = 'icon';
    el.style.backgroundImage = `url(${window.ART.images.items})`;
    el.style.backgroundSize = `${A.cols * fw * Z}px ${A.rows * fh * Z}px`;
    el.style.backgroundPosition =
      `-${(index % A.cols) * fw * Z}px -${Math.floor(index / A.cols) * fh * Z}px`;
    return el;
  };

  window.__inventory = ({ slots, cols, cursor, open, weapon, armor }) => {
    const icon = itemIcon;
    const grid = $('slots');
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.replaceChildren();
    slots.forEach((it, i) => {
      const c = document.createElement('div');
      c.className = 'cell' + (i === cursor ? ' cur' : '');
      if (it) { c.title = it.name; c.append(icon(it.index)); }
      grid.append(c);
    });
    const under = slots[cursor];
    const verb = { weapon: 'E to draw', armor: 'E to put on' };
    $('bagname').textContent = under
      ? under.name + (under.gear ? ` - ${verb[under.gear]}` : '')
      : (slots.some(Boolean) ? '' : 'empty - walk up to something and press E');
    const bag = $('bag');
    bag.classList.toggle('open', open);
    bag.setAttribute('aria-hidden', open ? 'false' : 'true');
    $('wname').textContent = `⚔ ${weapon || 'no weapon'} · ⛨ ${armor || 'no armour'}`;
  };

  // The character sheet. Worn gear is shown here and nowhere else: taking a
  // sword out of the bag moves it onto the body, and the bag slot it came from
  // is genuinely free again.
  window.__sheet = (c) => {
    const panel = $('sheet');
    $('cname').textContent = c.name;
    $('clvl').textContent = `LEVEL ${c.level}`;

    const bar = (cls, now, max) => {
      const wrap = document.createElement('div');
      wrap.className = 'meter';
      const fill = document.createElement('i');
      fill.className = cls;
      fill.style.width = `${Math.max(0, Math.min(100, (now / max) * 100))}%`;
      wrap.append(fill);
      return wrap;
    };
    const row = (key, value, meter) => {
      const el = document.createElement('div');
      el.className = 'stat' + (meter ? '' : ' plain');
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = key;
      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = value;
      if (meter) el.append(k, meter, v); else el.append(k, v);
      return el;
    };

    const stats = $('cstats');
    stats.replaceChildren(
      row('Health', `${c.hp} / ${c.hpMax}`, bar('hp', c.hp, c.hpMax)),
      row('Experience', `${c.xp} / ${c.xpNext}`, bar('xp', c.xp, c.xpNext)),
      row('To next', `${Math.max(0, c.xpNext - c.xp)} xp`),
      row('Damage', String(c.damage)),
      row('Armour', String(c.armor)),
    );

    const gear = $('cgear');
    gear.replaceChildren();
    c.slots.forEach((s2, i) => {
      const box = document.createElement('div');
      box.className = 'slot';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = s2.label;
      const cell = document.createElement('div');
      cell.className = 'cell' + (i === c.cursor ? ' cur' : '') + (s2.item ? '' : ' empty');
      if (s2.item) { cell.title = s2.item.name; cell.append(itemIcon(s2.item.index)); }
      else cell.textContent = s2.kind === 'weapon' ? '⚔' : '⛨';
      const worn = document.createElement('div');
      worn.className = 'worn';
      if (s2.item) {
        worn.textContent = s2.item.name;
        const em = document.createElement('em');
        em.textContent = c.bagFull ? 'bag full' : s2.item.stat;
        worn.append(em);
      } else {
        worn.textContent = '—';
      }
      box.append(label, cell, worn);
      // Tapping a slot takes that piece off, the same as E on it.
      box.addEventListener('pointerdown', (e) => {
        e.preventDefault();

 can."],"choices":[{"text":"Something else.","goto":"greet"},{"text":"I should go."}]},"jobs":{"text":["Always something. Standing still is the one thing I am no good at."],"choices":[{"text":"Something I could fetch?","goto":"berries_ask","when":{"quest":{"id":"quest.arne_berries","is":"none"}}},{"text":"I have your berries.","goto":"berries_done","when":{"quest":{"id":"quest.arne_berries","is":"ready"}},"finish":"quest.arne_berries"},{"text":"Still picking.","goto":"berries_wait","when":{"quest":{"id":"quest.arne_berries","is":"active"}}},{"text":"Something worth a blade?","goto":"boars_ask","when":{"all":[{"quest":{"id":"quest.arne_berries","is":"done"}},{"quest":{"id":"quest.arne_boars","is":"none"}}]}},{"text":"Three boars, down.","goto":"boars_done","when":{"quest":{"id":"quest.arne_boars","is":"ready"}},"finish":"quest.arne_boars"},{"text":"Still counting boars.","goto":"boars_wait","when":{"quest":{"id":"quest.arne_boars","is":"active"}}},{"text":"Anything in the way of ore?","goto":"ore_ask","when":{"noflag":"arne.wants_ore"},"set":"arne.wants_ore"},{"text":"I have your ore.","goto":"ore_done","when":{"all":[{"flag":"arne.wants_ore"},{"noflag":"arne.gave_key"},{"has":"item.ore"}]},"take":"item.ore","give":"item.key","set":"arne.gave_key"},{"text":"Still looking for that ore.","goto":"ore_wait","when":{"all":[{"flag":"arne.wants_ore"},{"noflag":"arne.gave_key"},{"nothas":"item.ore"}]}},{"text":"Another time.","goto":"greet"}]},"berries_ask":{"text":["Berries. Three handfuls, the small dark ones off the wood's edge.","Have a word with the goat before you go. It has the run of that patch and no manners at all."],"choices":[{"text":"I'll fetch them.","goto":"berries_took","start":"quest.arne_berries"},{"text":"Not today.","goto":"greet"}]},"berries_took":{"text":["Good. Up past the old stump, where the light gets in."],"choices":[{"text":"Right.","goto":"greet"}]},"berries_wait":{"text":["Three handfuls. And the goat first, unless you fancy picking stalks."],"choices":[{"text":"Right."}]},"berries_done":{"text":["That is the lot, and good weight on them.","Here - a coin, and my thanks. I will make something of these."],"choices":[{"text":"Thank you.","goto":"greet"}]},"boars_ask":{"text":["Boars. They have come up out of the southern meadow and they are not shy.","Three fewer would do. Go down and see for yourself first - it is south of the crossing."],"choices":[{"text":"I'll see to it.","goto":"boars_took","start":"quest.arne_boars"},{"text":"I'd rather not.","goto":"greet"}]},"boars_took":{"text":["Mind the tusks. They go for the legs, every time."],"choices":[{"text":"Right.","goto":"greet"}]},"boars_wait":{"text":["South, past the crossing. You will hear them before you see them."],"choices":[{"text":"Right."}]},"boars_done":{"text":["Three. I will sleep better for that.","Take this. My father's second best, and better than nothing."],"choices":[{"text":"Thank you.","goto":"greet"}]},"ore_ask":{"text":["As it happens. The grey outcrops west of here have iron in them - red in the grey.","Bring me a lump and I will make it worth the walk."],"choices":[{"text":"I'll have a look.","goto":"greet"}]},"ore_wait":{"text":["West, past the pines. Red in the grey. You will not miss it."],"choices":[{"text":"Right."}]},"ore_done":{"text":["Good weight on that. It will do.","Here - the key to the chest in the shed, back east.","It was my father's. I never had the stomach for what is in it."],"choices":[{"text":"Thank you.","goto":"greet"}]},"chest_talk":{"text":["Open it. Whatever is in there has waited long enough."],"choices":[{"text":"I will.","goto":"greet"}]}}},"dlg.chest":{"id":"dlg.chest","speaker":"A heavy chest","start":[{"when":{"flag":"chest.opened"},"goto":"empty"},{"goto":"shut"}],"nodes":{"shut":{"text":["Locked. Someone went to real trouble over it."],"choices":[{"text":"Turn the key.","goto":"open","when":{"has":"item.key"},"take":"item.key","give":"item.coin","set":"chest.opened"},{"text":"Leave it."}]},"open":{"
