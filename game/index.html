<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverside Sandbox</title>
<style>
  :root { --bg:#141821; --panel:#1e2531; --ink:#e8e4da; --muted:#8b93a7; --accent:#74c46b; }
  * { box-sizing: border-box; }
  /* 100% rather than 100vh: when this page is embedded in a host that already
     pads for the phone's safe area, 100vh would overflow it by exactly that. */
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding-block: 20px; padding-inline: 20px;
    font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .stage {
    position: relative; width: min(94vw, 960px); aspect-ratio: 4 / 3;
    background: #000; border: 2px solid #2c3242; border-radius: 4px;
    overflow: hidden; box-shadow: 0 10px 40px #0008;
  }
  #game, #game canvas { width: 100%; height: 100%; display: block; }

  #dialogue {
    position: absolute; left: 4%; right: 4%; bottom: 4%;
    display: none; flex-direction: column; gap: 6px;
    padding: 12px 14px; background: #10141ce8; border: 2px solid #4b5568;
    border-radius: 4px;
  }
  #dialogue.show { display: flex; }
  #speaker { color: var(--accent); font-size: 13px; }
  #line { font-size: 15px; line-height: 1.45; }
  #more { color: var(--muted); font-size: 12px; text-align: right; }

  #focus {
    position: absolute; inset: 0; display: none; place-items: center;
    background: #0b0e14b0; cursor: pointer;
  }
  #focus.show { display: grid; }
  #focus span { border: 1px solid #ffffff40; border-radius: 4px; padding: 9px 14px; background: #1e2531cc; }

  .bar { width: min(94vw, 960px); display: flex; flex-wrap: wrap; gap: 8px 20px;
         align-items: center; justify-content: space-between; color: var(--muted); }
  kbd { background: var(--panel); border: 1px solid #39405240; border-bottom-width: 2px;
        border-radius: 3px; padding: 1px 6px; color: var(--ink); }
  #hud { color: var(--accent); }
  #prompt { color: var(--ink); }

  /* The bag: a wooden panel that slides in from the left of the stage. Planks
     are a repeating gradient in the palette's wood tones; slots are cells of a
     dark grid, so the thin lines between them are the grid showing through. */
  #bag {
    position: absolute; left: 0; top: 0; bottom: 0; width: min(46%, 340px);
    display: flex; flex-direction: column; gap: 3%; padding: 4% 3.5%;
    background:
      repeating-linear-gradient(180deg, #7a5a38 0 26px, #6a4c2e 26px 28px, #8a683f 28px 30px, #7a5a38 30px 34px);
    border-right: 4px solid #3d2a17; box-shadow: 6px 0 18px #0007;
    transform: translateX(-104%); transition: transform .22s ease-out;
  }
  #bag.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { #bag { transition: none; } }
  #bag .title { color: #f1e4c8; font-weight: 600; letter-spacing: .06em; text-shadow: 0 1px 0 #3d2a17; }
  #bag .hint { color: #d9c7a3; font-size: 11px; }
  #slots {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
    background: #3d2a17; border: 2px solid #3d2a17; border-radius: 3px;
  }
  #slots .cell {
    aspect-ratio: 1; display: grid; place-items: center; background: #5e4229;
    box-shadow: inset 0 2px 0 #6d4f31, inset 0 -2px 0 #4d3520;
  }
  #slots .cell.cur { outline: 2px solid var(--accent); outline-offset: -2px; }
  #slots .cell.on { background: #4f5a2c; }
  #slots .icon { width: 48px; height: 48px; max-width: 80%; max-height: 80%;
                 image-rendering: pixelated; background-repeat: no-repeat; }
  #bag .name { color: #f1e4c8; min-height: 1.5em; }
  #wname { color: var(--accent); }

  /* touch controls: a d-pad and the three actions, only on coarse pointers */
  .touch { display: none; gap: 16px; align-items: center; }
  @media (pointer: coarse) { .touch { display: flex; } }
  .dpad { display: grid; grid-template-columns: repeat(3, 44px); gap: 5px; }
  .acts { display: grid; grid-template-columns: repeat(2, 52px); gap: 5px; }
  .touch button { height: 44px; font-size: 15px; color: var(--ink); background: var(--panel);
                  border: 1px solid #39405260; border-radius: 4px; touch-action: none; }
  .touch button.on { background: var(--accent); color: #10141c; }
  .dpad .sp { visibility: hidden; }
  .acts .slash { font-size: 19px; }
</style>
</head>
<body>

<h1>Riverside <span>&middot; 96&times;72 tiles &middot; map, props, NPCs all from content/</span></h1>

<div class="stage">
  <div id="game"></div>
  <div id="dialogue">
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="more"></div>
  </div>
  <div id="bag" aria-hidden="true">
    <div class="title">BAG</div>
    <div id="slots"></div>
    <div class="name" id="bagname"></div>
    <div class="hint">arrows move &middot; E equip / remove &middot; I close</div>
  </div>
  <div id="focus"><span>Click to play</span></div>
</div>

<div class="bar">
  <div>
    <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move
    &nbsp; <kbd>E</kbd> talk / take &nbsp; <kbd>Space</kbd> slash &nbsp; <kbd>I</kbd> bag &nbsp; <kbd>Q</kbd> swap
    &nbsp; <span id="prompt"></span>
  </div>
  <div><span id="wname">&#9876; no weapon</span> &nbsp; <span id="hud">idle-down</span></div>
</div>

<div class="touch">
  <div class="dpad">
    <button class="sp" tabindex="-1"></button>
    <button data-dir="up" aria-label="Move up">&uarr;</button>
    <button class="sp" tabindex="-1"></button>
    <button data-dir="left" aria-label="Move left">&larr;</button>
    <button data-dir="down" aria-label="Move down">&darr;</button>
    <button data-dir="right" aria-label="Move right">&rarr;</button>
  </div>
  <div class="acts">
    <button data-act="talk" aria-label="Talk or take">E</button>
    <button data-act="slash" class="slash" aria-label="Slash">&#9876;</button>
    <button data-act="swap" aria-label="Swap weapon">Q</button>
    <button data-act="bag" aria-label="Open the bag">I</button>
  </div>
</div>

<script>
  const $ = (s) => document.getElementById(s);

  window.__hud = ({ anim, tile, prompt, verb, bagFull, talking }) => {
    $('hud').textContent = `${anim}  tile ${tile[0]},${tile[1]}`;
    let p = '';
    if (!talking && prompt) {
      p = verb === 'take' && bagFull ? `bag full - ${prompt} stays` : `press E: ${verb} ${prompt}`;
    }
    $('prompt').textContent = p;
  };

  // The bag. Icons are the world's own item cells, read straight out of the
  // items atlas at 3x, so a thing looks the same on the ground and in hand.
  window.__inventory = ({ slots, cols, cursor, open, weapon, armor }) => {
    const A = window.ART.manifest.atlases.items;
    const [fw, fh] = A.frame;
    const Z = 3;
    const icon = (index) => {
      const el = document.createElement('span');
      el.className = 'icon';
      el.style.backgroundImage = `url(${window.ART.images.items})`;
      el.style.backgroundSize = `${A.cols * fw * Z}px ${A.rows * fh * Z}px`;
      el.style.backgroundPosition =
        `-${(index % A.cols) * fw * Z}px -${Math.floor(index / A.cols) * fh * Z}px`;
      return el;
    };
    const grid = $('slots');
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.replaceChildren();
    slots.forEach((it, i) => {
      const c = document.createElement('div');
      c.className = 'cell' + (i === cursor ? ' cur' : '') + (it && it.equipped ? ' on' : '');
      if (it) { c.title = it.name; c.append(icon(it.index)); }
      grid.append(c);
    });
    const under = slots[cursor];
    const verb = { weapon: ['in hand', 'E to draw'], armor: ['worn', 'E to put on'] };
    $('bagname').textContent = under
      ? under.name + (under.gear ? ` - ${verb[under.gear][under.equipped ? 0 : 1]}` : '')
      : (slots.some(Boolean) ? '' : 'empty - walk up to something and press E');
    const bag = $('bag');
    bag.classList.toggle('open', open);
    bag.setAttribute('aria-hidden', open ? 'false' : 'true');
    $('wname').textContent = `⚔ ${weapon || 'no weapon'} · ⛨ ${armor || 'no armour'}`;
  };

  window.__dialogue = (d) => {
    const box = $('dialogue');
    if (!d) { box.classList.remove('show'); return; }
    $('speaker').textContent = d.speaker || '';
    $('line').textContent = d.text;
    $('more').textContent = d.more ? 'E / space →' : 'E / space to close';
    box.classList.add('show');
  };

  window.__pad = {};
  document.querySelectorAll('.dpad button[data-dir]').forEach((b) => {
    const dir = b.dataset.dir;
    const set = (v) => (e) => { e.preventDefault(); window.__pad[dir] = v; b.classList.toggle('on', v); };
    b.addEventListener('pointerdown', set(true));
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, set(false)));
  });
  document.querySelectorAll('.acts button[data-act]').forEach((b) => {
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (window.__act) window.__act(b.dataset.act);
    });
  });

  const focusEl = $('focus');
  if (!document.hasFocus()) focusEl.classList.add('show');
  document.addEventListener('pointerdown', () => focusEl.classList.remove('show'));
  window.addEventListener('focus', () => focusEl.classList.remove('show'));
  window.addEventListener('blur', () => focusEl.classList.add('show'));
</script>

<script src="vendor/phaser.min.js"></script>
<script>
  if (!window.Phaser) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"><\/script>');
  }
</script>
<script src="art-embed.js"></script>
<script src="main.js"></script>

</body>
</html>
