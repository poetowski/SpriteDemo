<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverside Sandbox</title>
<style>
  /* The frame round the window is made of the same five colours as the view
     through it - the ramp in tools/gen/palette.py, nothing mixed by eye.
     https://coolors.co/e5c2c0-8fd5a6-329f5b-0c8346-0d5d56

     Only INK is dark enough to carry text at 4.5:1, so every panel is INK and
     every raised cell is DEEP with an icon on it rather than words. Selected
     things invert to INK on MINT: the two light ends of this ramp are the same
     value, so a flip is the only highlight that stays readable. Shadows stay
     transparent black - a shadow is an absence of light, not a sixth colour. */
  :root {
    --ink:#0d5d56; --deep:#0c8346; --mid:#329f5b; --mint:#8fd5a6; --rose:#e5c2c0;
    --bg:var(--ink); --panel:var(--deep); --text:var(--rose);
    --muted:var(--mint); --accent:var(--mint);
    /* Planks: dark boards with a lit seam, the same read as the wood_floor
       tile, because on this ramp a groove can only be lighter than INK. One
       pixel of it - at three the panels read as ruled paper, since INK to DEEP
       is the widest step on the ramp. */
    --planks: repeating-linear-gradient(180deg,
      var(--ink) 0 33px, var(--deep) 33px 34px);
  }
  * { box-sizing: border-box; }
  /* 100% rather than 100vh: when this page is embedded in a host that already
     pads for the phone's safe area, 100vh would overflow it by exactly that. */
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding-block: 20px; padding-inline: 20px;
    font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .stage {
    position: relative; width: min(94vw, 960px); aspect-ratio: 4 / 3;
    background: var(--ink); border: 2px solid var(--deep); border-radius: 4px;
    overflow: hidden; box-shadow: 0 10px 40px #0008;
  }
  #game, #game canvas { width: 100%; height: 100%; display: block; }

  /* The talk panel: the same planks as the bag, sliding up from the bottom. */
  #dialogue {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px;
    background: var(--planks);
    border-top: 4px solid var(--mid); box-shadow: 0 -6px 18px #0007;
    transform: translateY(104%); transition: transform .2s ease-out;
  }
  #dialogue.show { transform: none; }
  @media (prefers-reduced-motion: reduce) { #dialogue { transition: none; } }
  #speaker { align-self: flex-start; font-size: 12px; letter-spacing: .08em;
             color: var(--ink); background: var(--mint); padding: 2px 8px; border-radius: 2px; }
  #speaker:empty { display: none; }
  #line { font-size: 15px; line-height: 1.45; color: var(--text); }
  #more { color: var(--muted); font-size: 12px; text-align: right; }
  #choices { display: flex; flex-direction: column; gap: 2px; }
  #choices:empty { display: none; }
  #choices button {
    display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left;
    font: inherit; color: var(--text); background: var(--ink); border: 2px solid var(--mid);
    border-radius: 3px; padding: 5px 9px; cursor: pointer;
  }
  #choices button .n { color: var(--muted); font-size: 11px; }
  #choices button.on { background: var(--mint); color: var(--ink); border-color: var(--rose); }
  #choices button.on .n { color: var(--deep); }

  #focus {
    position: absolute; inset: 0; display: none; place-items: center;
    background: #0d5d56cc; cursor: pointer;
  }
  #focus.show { display: grid; }
  #focus span { border: 1px solid var(--mid); border-radius: 4px; padding: 9px 14px; background: var(--ink); }

  .bar { width: min(94vw, 960px); display: flex; flex-wrap: wrap; gap: 8px 20px;
         align-items: center; justify-content: space-between; color: var(--muted); }
  kbd { background: var(--ink); border: 1px solid var(--mid); border-bottom-width: 2px;
        border-radius: 3px; padding: 1px 6px; color: var(--text); }
  #hud { color: var(--accent); }
  #prompt { color: var(--text); }

  /* The bag: a panel of planks that slides in from the left of the stage.
     Slots are cells of a lighter grid, so the thin lines between them are the
     grid showing through. */
  #bag {
    position: absolute; left: 0; top: 0; bottom: 0; width: min(46%, 340px);
    display: flex; flex-direction: column; gap: 3%; padding: 4% 3.5%;
    background: var(--planks);
    border-right: 4px solid var(--mid); box-shadow: 6px 0 18px #0007;
    transform: translateX(-104%); transition: transform .22s ease-out;
  }
  #bag.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { #bag { transition: none; } }
  #bag .title { color: var(--text); font-weight: 600; letter-spacing: .06em; }
  #bag .hint { color: var(--muted); font-size: 11px; }
  #slots {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
    background: var(--mid); border: 2px solid var(--mid); border-radius: 3px;
  }
  #slots .cell {
    aspect-ratio: 1; display: grid; place-items: center; background: var(--panel);
    box-shadow: inset 0 2px 0 var(--mid), inset 0 -2px 0 var(--ink);
  }
  #slots .cell.cur { outline: 2px solid var(--rose); outline-offset: -2px; }
  #slots .cell.on { background: var(--mint); }
  .icon { width: 48px; height: 48px; max-width: 80%; max-height: 80%;
          image-rendering: pixelated; background-repeat: no-repeat; }
  #bag .name { color: var(--text); min-height: 1.5em; }
  #wname { color: var(--accent); }

  /* The character sheet: the same planks as the bag, dropping from the top.
     Each panel comes from the edge it belongs to - bag from the pack at your
     side, talk from the person in front of you, this from you. */
  #sheet {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px;
    background: var(--planks);
    border-bottom: 4px solid var(--mid); box-shadow: 0 6px 18px #0007;
    transform: translateY(-104%); transition: transform .22s ease-out;
  }
  #sheet.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { #sheet { transition: none; } }
  #sheet .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #sheet .name { color: var(--text); font-size: 17px; letter-spacing: .02em; }
  #sheet .lvl { color: var(--ink); font-size: 12px; letter-spacing: .08em;
                background: var(--mint); padding: 2px 8px; border-radius: 2px; }
  #sheet .cols { display: grid; grid-template-columns: minmax(0, 360px) auto;
                 gap: 16px 28px; align-items: start; justify-content: space-between; }
  @media (max-width: 560px) { #sheet .cols { grid-template-columns: 1fr; } }

  .stats { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .stat { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; }
  .stat .k { color: var(--muted); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; }
  .stat .v { color: var(--text); font-variant-numeric: tabular-nums; }
  .stat .meter { width: 100%; height: 10px; background: var(--panel); border-radius: 2px;
                 overflow: hidden; box-shadow: inset 0 1px 0 #00000055; }
  .stat .meter i { display: block; height: 100%; }
  /* Health and experience are the same value on this ramp, so they are told
     apart by hue: the warm one is the one that runs out. */
  .stat .meter i.hp { background: linear-gradient(var(--rose), var(--mid)); }
  .stat .meter i.xp { background: linear-gradient(var(--mint), var(--deep)); }
  .stat.plain .v { grid-column: 2 / 4; justify-self: start; }

  .gear { display: flex; gap: 10px; }
  .gear .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 80px; }
  .gear .label { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .gear .cell {
    width: 100%; aspect-ratio: 1; display: grid; place-items: center;
    background: var(--panel); border: 2px solid var(--mid); border-radius: 3px;
    box-shadow: inset 0 2px 0 var(--mid), inset 0 -2px 0 var(--ink);
  }
  .gear .cell.cur { outline: 2px solid var(--rose); outline-offset: -4px; }
  .gear .cell.empty { color: var(--mint); font-size: 20px; }
  .gear .worn { color: var(--text); font-size: 11px; text-align: center; min-height: 2.6em; }
  .gear .worn em { display: block; color: var(--muted); font-style: normal; font-size: 10px; }
  #sheet .hint { color: var(--muted); font-size: 11px; }

  /* touch controls: a d-pad and the three actions, only on coarse pointers */
  .touch { display: none; gap: 16px; align-items: center; }
  @media (pointer: coarse) { .touch { display: flex; } }
  .dpad { display: grid; grid-template-columns: repeat(3, 44px); gap: 5px; }
  .acts { display: grid; grid-template-columns: repeat(2, 52px); gap: 5px; }
  .touch button { height: 44px; font-size: 15px; color: var(--text); background: var(--ink);
                  border: 1px solid var(--mid); border-radius: 4px; touch-action: none; }
  .touch button.on { background: var(--accent); color: var(--ink); }
  .dpad .sp { visibility: hidden; }
  .acts .slash { font-size: 19px; }
</style>
</head>
<body>

<h1>Riverside <span>&middot; 30&times;30 tiles &middot; 2x art &middot; map, props, NPCs all from content/</span></h1>

<div class="stage">
  <div id="game"></div>
  <div id="dialogue">
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="choices"></div>
    <div id="more"></div>
  </div>
  <div id="bag" aria-hidden="true">
    <div class="title">BAG</div>
    <div id="slots"></div>
    <div class="name" id="bagname"></div>
    <div class="hint">arrows move &middot; E equip / remove &middot; I close</div>
  </div>
  <div id="sheet" aria-hidden="true">
    <div class="who">
      <span class="name" id="cname"></span>
      <span class="lvl" id="clvl"></span>
    </div>
    <div class="cols">
      <div class="stats" id="cstats"></div>
      <div class="gear" id="cgear"></div>
    </div>
    <div class="hint">&larr; &rarr; choose &middot; E take off &middot; C close</div>
  </div>
  <div id="focus"><span>Click to play</span></div>
</div>

<div class="bar">
  <div>
    <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move
    &nbsp; <kbd>E</kbd> talk / take &nbsp; <kbd>Space</kbd> slash &nbsp; <kbd>I</kbd> bag &nbsp; <kbd>C</kbd> sheet &nbsp; <kbd>Q</kbd> swap
    &nbsp; <span id="prompt"></span>
  </div>
  <div><span id="wname">&#9876; no weapon</span> &nbsp; <span id="hud">idle-down</span></div>
</div>

<div class="touch">
  <div class="dpad">
    <button class="sp" tabindex="-1"></button>
    <button data-dir="up" aria-label="Move up">&uarr;</button>
    <button class="sp" tabindex="-1"></button>
    <button data-dir="left" aria-label="Move left">&larr;</button>
    <button data-dir="down" aria-label="Move down">&darr;</button>
    <button data-dir="right" aria-label="Move right">&rarr;</button>
  </div>
  <div class="acts">
    <button data-act="talk" aria-label="Talk or take">E</button>
    <button data-act="slash" class="slash" aria-label="Slash">&#9876;</button>
    <button data-act="swap" aria-label="Swap weapon">Q</button>
    <button data-act="bag" aria-label="Open the bag">I</button>
    <button data-act="sheet" aria-label="Open the character sheet">C</button>
  </div>
</div>

<script>
  const $ = (s) => document.getElementById(s);

  window.__hud = ({ anim, tile, prompt, verb, bagFull, talking }) => {
    $('hud').textContent = `${anim}  tile ${tile[0]},${tile[1]}`;
    let p = '';
    if (!talking && prompt) {
      p = verb === 'take' && bagFull ? `bag full - ${prompt} stays` : `press E: ${verb} ${prompt}`;
    }
    $('prompt').textContent = p;
  };

  // The bag. Icons are the world's own item cells, read straight out of the
  // items atlas at 3x, so a thing looks the same on the ground and in hand.
  const itemIcon = (index) => {
    const A = window.ART.manifest.atlases.items;
    const [fw, fh] = A.frame;
    const Z = 3;
    const el = document.createElement('span');
    el.className = 'icon';
    el.style.backgroundImage = `url(${window.ART.images.items})`;
    el.style.backgroundSize = `${A.cols * fw * Z}px ${A.rows * fh * Z}px`;
    el.style.backgroundPosition =
      `-${(index % A.cols) * fw * Z}px -${Math.floor(index / A.cols) * fh * Z}px`;
    return el;
  };

  window.__inventory = ({ slots, cols, cursor, open, weapon, armor }) => {
    const icon = itemIcon;
    const grid = $('slots');
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.replaceChildren();
    slots.forEach((it, i) => {
      const c = document.createElement('div');
      c.className = 'cell' + (i === cursor ? ' cur' : '');
      if (it) { c.title = it.name; c.append(icon(it.index)); }
      grid.append(c);
    });
    const under = slots[cursor];
    const verb = { weapon: 'E to draw', armor: 'E to put on' };
    $('bagname').textContent = under
      ? under.name + (under.gear ? ` - ${verb[under.gear]}` : '')
      : (slots.some(Boolean) ? '' : 'empty - walk up to something and press E');
    const bag = $('bag');
    bag.classList.toggle('open', open);
    bag.setAttribute('aria-hidden', open ? 'false' : 'true');
    $('wname').textContent = `⚔ ${weapon || 'no weapon'} · ⛨ ${armor || 'no armour'}`;
  };

  // The character sheet. Worn gear is shown here and nowhere else: taking a
  // sword out of the bag moves it onto the body, and the bag slot it came from
  // is genuinely free again.
  window.__sheet = (c) => {
    const panel = $('sheet');
    $('cname').textContent = c.name;
    $('clvl').textContent = `LEVEL ${c.level}`;

    const bar = (cls, now, max) => {
      const wrap = document.createElement('div');
      wrap.className = 'meter';
      const fill = document.createElement('i');
      fill.className = cls;
      fill.style.width = `${Math.max(0, Math.min(100, (now / max) * 100))}%`;
      wrap.append(fill);
      return wrap;
    };
    const row = (key, value, meter) => {
      const el = document.createElement('div');
      el.className = 'stat' + (meter ? '' : ' plain');
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = key;
      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = value;
      if (meter) el.append(k, meter, v); else el.append(k, v);
      return el;
    };

    const stats = $('cstats');
    stats.replaceChildren(
      row('Health', `${c.hp} / ${c.hpMax}`, bar('hp', c.hp, c.hpMax)),
      row('Experience', `${c.xp} / ${c.xpNext}`, bar('xp', c.xp, c.xpNext)),
      row('To next', `${Math.max(0, c.xpNext - c.xp)} xp`),
      row('Damage', String(c.damage)),
      row('Armour', String(c.armor)),
    );

    const gear = $('cgear');
    gear.replaceChildren();
    c.slots.forEach((s2, i) => {
      const box = document.createElement('div');
      box.className = 'slot';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = s2.label;
      const cell = document.createElement('div');
      cell.className = 'cell' + (i === c.cursor ? ' cur' : '') + (s2.item ? '' : ' empty');
      if (s2.item) { cell.title = s2.item.name; cell.append(itemIcon(s2.item.index)); }
      else cell.textContent = s2.kind === 'weapon' ? '⚔' : '⛨';
      const worn = document.createElement('div');
      worn.className = 'worn';
      if (s2.item) {
        worn.textContent = s2.item.name;
        const em = document.createElement('em');
        em.textContent = c.bagFull ? 'bag full' : s2.item.stat;
        worn.append(em);
      } else {
        worn.textContent = '—';
      }
      box.append(label, cell, worn);
      // Tapping a slot takes that piece off, the same as E on it.
      box.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (window.__gear) window.__gear(i);
      });
      gear.append(box);
    });

    panel.classList.toggle('open', c.open);
    panel.setAttribute('aria-hidden', c.open ? 'false' : 'true');
  };

  window.__dialogue = (d) => {
    const box = $('dialogue');
    if (!d) { box.classList.remove('show'); return; }
    $('speaker').textContent = d.speaker || '';
    $('line').textContent = d.text;
    const list = $('choices');
    list.replaceChildren();
    (d.choices || []).forEach((text, i) => {
      const b = document.createElement('button');
      b.className = i === d.pick ? 'on' : '';
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = i + 1;
      b.append(n, document.createTextNode(text));
      // Tapping a reply is the whole interaction on a phone, where there is
      // no number row and the d-pad is across the screen.
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (window.__choose) window.__choose(i);
      });
      list.append(b);
    });
    $('more').textContent = d.more ? 'E / space →'
      : (d.choices && d.choices.length ? 'arrows or 1-4 · E to answer'
                                       : 'E / space to close');
    box.classList.add('show');
  };

  window.__pad = {};
  document.querySelectorAll('.dpad button[data-dir]').forEach((b) => {
    const dir = b.dataset.dir;
    const set = (v) => (e) => { e.preventDefault(); window.__pad[dir] = v; b.classList.toggle('on', v); };
    b.addEventListener('pointerdown', set(true));
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, set(false)));
  });
  document.querySelectorAll('.acts button[data-act]').forEach((b) => {
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (window.__act) window.__act(b.dataset.act);
    });
  });

  const focusEl = $('focus');
  if (!document.hasFocus()) focusEl.classList.add('show');
  document.addEventListener('pointerdown', () => focusEl.classList.remove('show'));
  window.addEventListener('focus', () => focusEl.classList.remove('show'));
  window.addEventListener('blur', () => focusEl.classList.add('show'));
</script>

<script src="vendor/phaser.min.js"></script>
<script>
  if (!window.Phaser) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"><\/script>');
  }
</script>
<script src="art-embed.js"></script>
<script src="main.js"></script>

</body>
</html>
